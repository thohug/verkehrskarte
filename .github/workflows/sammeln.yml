name: Verkehrsdaten sammeln

on:
  schedule:
    # Alle 30 Minuten geplant. GitHub haelt das nicht ein - gemessen lagen
    # zwischen zwei tatsaechlichen Laeufen 1 bis fast 4 Stunden. Deshalb misst
    # JEDER Lauf ueber ~2 Stunden hinweg (siehe unten), sodass eine einzige
    # Ausführung die typische Luecke schon ueberbrueckt. Der haeufige Zeitplan
    # sorgt nur dafuer, dass nach einem Lauf bald wieder einer angestossen wird.
    - cron: "*/30 * * * *"
  workflow_dispatch:        # erlaubt manuelles Ausloesen

permissions:
  contents: write           # noetig, um die Messwerte zurueck ins Repo zu schreiben

concurrency:
  group: sammeln
  # Laeuft schon einer, wird der neue nur angestellt (nicht der laufende
  # abgebrochen). GitHub behaelt je Gruppe hoechstens einen wartenden Lauf -
  # ueberzaehlige Ausloeser waehrend eines 2-Stunden-Laufs verfallen also, statt
  # sich aufzustauen. Ergebnis: nahezu lueckenlose Abdeckung ohne Stau.
  cancel-in-progress: false

jobs:
  sammeln:
    runs-on: ubuntu-latest
    # 24 Messungen im Abstand von 5 Minuten = rund 2 Stunden. Reserve fuer
    # langsame API-Antworten. Oeffentliches Repo: Laufzeit kostet nichts.
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v7

      # Bewusst kein actions/setup-python: der ubuntu-latest-Runner bringt
      # Python 3 mit, und collect.py kommt mit der Standardbibliothek aus.
      #
      # Der Lauf misst 24-mal im Abstand von 5 Minuten (~2 Stunden) und
      # committet NACH JEDER Messung. Zwei Gruende:
      #   - GitHub feuert geplante Laeufe unzuverlaessig (Luecken bis ~4 h);
      #     ein langes Messfenster pro Lauf ueberbrueckt das.
      #   - Durch das Committen nach jeder Messung erscheinen die Daten laufend
      #     im Repo, nicht erst am Ende der zwei Stunden.
      # Die Wiederholung liegt hier im Skript (nicht in collect.py --wiederholen),
      # damit zwischen den Messungen committet werden kann.
      - name: Sammeln und laufend committen
        env:
          HERE_API_KEY: ${{ secrets.HERE_API_KEY }}
        run: |
          set -u
          git config user.name  "verkehrskarte-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          hochladen() {
            git add messungen segmente
            if git diff --staged --quiet; then return 0; fi
            git commit -q -m "Messung $(date -u '+%Y-%m-%d %H:%M')Z"
            # Jeder Lauf legt nur eindeutig benannte Dateien an, der Rebase ist
            # also konfliktfrei. Sollte doch einer auftreten, sauber abbrechen.
            for versuch in 1 2 3; do
              if git push; then return 0; fi
              echo "Push abgelehnt, ziehe nach (Versuch $versuch)"
              git fetch origin main || true
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Rebase-Konflikt - sollte nicht vorkommen." >&2
                return 1
              fi
            done
            return 1
          }

          ANZAHL=24
          ABSTAND=300
          gelungen=0
          for i in $(seq 1 "$ANZAHL"); do
            if python3 collect.py --kompakt; then
              gelungen=$((gelungen + 1))
            else
              echo "Messung $i/$ANZAHL fehlgeschlagen"
            fi
            hochladen || echo "Commit/Push nach Messung $i fehlgeschlagen"
            if [ "$i" -lt "$ANZAHL" ]; then sleep "$ABSTAND"; fi
          done

          echo "$gelungen von $ANZAHL Messungen gesammelt."
          # Nur rot werden, wenn gar nichts zusammenkam.
          [ "$gelungen" -gt 0 ]
